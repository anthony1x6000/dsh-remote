# Remote access bundle for DeepSeek Harness (dsh web).
# Install: dsh plugin --profile web add "github:anthony1x6000/dsh-remote#main"
# This row overrides the webserver bind; it restates the whole row config
# (patches replace, never deep-merge). Your profile patch can override it
# again without touching this package.

- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
