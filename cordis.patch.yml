# Remote access overlay for DeepSeek Harness (dsh web)
# Usage (without modifying profiles):
#   dsh web --patch <path-to>/cordis.patch.yml
# Or install permanently into ~/.dsh/profiles/web/cordis.patch.yml

- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024
